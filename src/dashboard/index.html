<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minilytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231c1917'/><path d='M8 22l5-7 4 4 7-10' stroke='%23e07b5f' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet" />
    <script>
      // minilytics.app tracks itself with Minilytics. Only on that domain, so self-hosted dashboards load nothing extra.
      if (/(^|\.)minilytics\.app$/.test(location.hostname)) {
        // Queue calls (identify, goal) made before the script has loaded; the tracker replays them.
        window.minilytics = window.minilytics || function () { (window.minilytics.q = window.minilytics.q || []).push(arguments); };
        var ml = document.createElement('script');
        ml.defer = true;
        ml.setAttribute('data-website-id', '2r2m2d29014o6243');
        ml.src = 'https://minilytics.app/js/script.js';
        document.head.appendChild(ml);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
